<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>牛奶蛙破風日記 | Amazon Milk Frog Road Cycling</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Noto Sans TC', 'Fredoka', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    body {
      font-family: var(--font-main);
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    .font-mono-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    /* Custom button tactile styles */
    .action-btn {
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 0 rgba(15, 23, 42, 0.18), 0 10px 20px -5px rgba(15, 23, 42, 0.15);
    }
    .action-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 9px 0 rgba(15, 23, 42, 0.2), 0 15px 25px -5px rgba(15, 23, 42, 0.2);
    }
    .action-btn:active, .action-btn.active-state {
      transform: translateY(4px) scale(0.98);
      box-shadow: 0 2px 0 rgba(15, 23, 42, 0.2), 0 4px 10px -3px rgba(15, 23, 42, 0.15);
    }
    /* Wet skin shimmer animation for rain mode */
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.55)); }
      50% { filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.95)); }
    }
    .wet-frog-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }
    /* LCD screen subtle scanline */
    .lcd-screen {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.15);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 md:p-6">

  <!-- Main Container Card -->
  <div class="w-full max-w-5xl bg-slate-100 rounded-3xl shadow-2xl border-4 border-slate-800 overflow-hidden flex flex-col">
    
    <!-- Top Header & Cycling Computer Dashboard (自行車碼表儀表板) -->
    <header class="bg-slate-800 text-white px-4 py-3 sm:px-6 sm:py-4 flex flex-col lg:flex-row items-center justify-between gap-4 border-b-4 border-slate-900">
      <!-- Title & Character Badge -->
      <div class="flex items-center gap-3 w-full lg:w-auto justify-between lg:justify-start">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-300 to-yellow-500 p-0.5 shadow-lg flex items-center justify-center border-2 border-white/80">
            <!-- Mini Yellow Pear Milk Frog Avatar SVG (還原照片呆萌大肚黃蛙頭像) -->
            <svg viewBox="0 0 60 60" class="w-11 h-11">
              <defs>
                <radialGradient id="avatarYellow" cx="0.35" cy="0.3" r="0.7">
                  <stop offset="0%" stop-color="#FFF078" />
                  <stop offset="55%" stop-color="#FFD026" />
                  <stop offset="100%" stop-color="#E09600" />
                </radialGradient>
              </defs>
              <!-- Pear-shaped head & belly -->
              <path d="M 12 56 C 10 38, 17 12, 31 12 C 45 12, 52 38, 50 56 Z" fill="url(#avatarYellow)" stroke="#5C4008" stroke-width="2" />
              <!-- Cream belly patch -->
              <ellipse cx="27" cy="48" rx="12" ry="10" fill="#F3DC92" />
              <!-- Far eye -->
              <circle cx="19" cy="24" r="4.5" fill="#8FC4A0" stroke="#4A3B1C" stroke-width="1.2" />
              <circle cx="18" cy="24" r="2.8" fill="#141414" />
              <!-- Near Mint-Green rimmed eye -->
              <circle cx="33" cy="24" r="6.5" fill="#8FC4A0" stroke="#4A3B1C" stroke-width="1.5" />
              <circle cx="32" cy="24" r="4.2" fill="#141414" />
              <circle cx="30.5" cy="22.5" r="1.3" fill="#FFFFFF" />
              <!-- Deadpan protruding snout mouth -->
              <path d="M 15 30 L 26 30" stroke="#2B2112" stroke-width="2.2" stroke-linecap="round" />
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg sm:text-xl font-black tracking-wide text-white">大肚黃奶蛙破風號</h1>
              <span id="statusBadge" class="px-2.5 py-0.5 text-xs font-bold rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
                🚴 挺肚巡航中
              </span>
            </div>
            <p class="text-xs text-slate-400">Chubby Yellow Belly Frog Road Cycling Simulator</p>
          </div>
        </div>

        <!-- Audio Mute Button (Mobile friendly placement) -->
        <button id="muteBtn" class="lg:hidden px-3 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs font-bold text-slate-200 flex items-center gap-1.5 border border-slate-600 transition">
          <span id="muteIconMobile">🔊</span> 音效
        </button>
      </div>

      <!-- Cycling Computer (GARMIN-style Froggy Head Unit) -->
      <div class="w-full lg:w-auto flex items-center justify-between sm:justify-end gap-2 sm:gap-3">
        <div class="lcd-screen rounded-2xl px-3 py-2 sm:px-4 sm:py-2.5 border-2 border-slate-600 flex items-center gap-3 sm:gap-5 w-full sm:w-auto justify-around">
          
          <!-- Speed km/h -->
          <div class="flex flex-col items-center sm:items-end">
            <span class="text-[10px] uppercase tracking-wider text-sky-400 font-bold flex items-center gap-1">
              <span>⚡ 時速</span>
              <span id="sprintFlame" class="hidden animate-bounce">🔥</span>
            </span>
            <div class="flex items-baseline gap-1">
              <span id="hudSpeed" class="font-mono-num text-2xl sm:text-3xl font-extrabold text-white">31.5</span>
              <span class="text-[11px] font-bold text-slate-400">km/h</span>
            </div>
          </div>

          <div class="h-8 w-[1px] bg-slate-700"></div>

          <!-- Cadence RPM -->
          <div class="flex flex-col items-center sm:items-end">
            <span class="text-[10px] uppercase tracking-wider text-emerald-400 font-bold">🔄 踏頻</span>
            <div class="flex items-baseline gap-1">
              <span id="hudCadence" class="font-mono-num text-2xl sm:text-3xl font-extrabold text-emerald-300">86</span>
              <span class="text-[11px] font-bold text-slate-400">RPM</span>
            </div>
          </div>

          <div class="h-8 w-[1px] bg-slate-700"></div>

          <!-- Power Watts -->
          <div class="hidden sm:flex flex-col items-end">
            <span class="text-[10px] uppercase tracking-wider text-amber-400 font-bold">💪 功率</span>
            <div class="flex items-baseline gap-1">
              <span id="hudPower" class="font-mono-num text-2xl sm:text-3xl font-extrabold text-amber-300">215</span>
              <span class="text-[11px] font-bold text-slate-400">W</span>
            </div>
          </div>

          <div class="hidden sm:block h-8 w-[1px] bg-slate-700"></div>

          <!-- Bugs / Calories -->
          <div class="flex flex-col items-center sm:items-end">
            <span class="text-[10px] uppercase tracking-wider text-pink-400 font-bold">🦟 捕蟲 / 熱量</span>
            <div class="flex items-baseline gap-1">
              <span id="hudBugs" class="font-mono-num text-2xl sm:text-3xl font-extrabold text-pink-300">0</span>
              <span class="text-[11px] font-bold text-slate-400">隻 (<span id="hudKcal" class="font-mono-num text-slate-300">42</span> kcal)</span>
            </div>
          </div>

        </div>

        <!-- Desktop Audio Mute Button -->
        <button id="muteBtnDesktop" title="切換音效" class="hidden lg:flex px-3.5 py-3 rounded-2xl bg-slate-700 hover:bg-slate-600 text-sm font-bold text-slate-200 items-center gap-1.5 border-2 border-slate-600 transition shrink-0">
          <span id="muteIconDesktop">🔊</span>
        </button>
      </div>
    </header>

    <!-- Main Interactive SVG Stage -->
    <div class="relative w-full aspect-[16/10] sm:aspect-[16/9] bg-sky-200 overflow-hidden select-none">
      
      <!-- Top-Left Weather & Environment Overlay Pill -->
      <div class="absolute top-3 left-3 sm:top-4 sm:left-4 z-10 flex flex-wrap items-center gap-2 pointer-events-none">
        <div id="weatherPill" class="backdrop-blur-md bg-white/75 text-slate-800 px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold shadow-md border border-white/60 flex items-center gap-1.5 transition-all">
          <span id="weatherIcon">☀️</span>
          <span id="weatherText">晴空微風 · 適合騎行</span>
        </div>
        <div id="humidityPill" class="hidden backdrop-blur-md bg-sky-500/85 text-white px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold shadow-md border border-sky-300/60 items-center gap-1 animate-pulse">
          💧 空氣濕度 100% · 牛奶蛙皮膚水潤發亮！
        </div>
      </div>

      <!-- Top-Right Quick Tip -->
      <div class="absolute top-3 right-3 sm:top-4 sm:right-4 z-10 pointer-events-none hidden sm:block">
        <div class="backdrop-blur-md bg-slate-900/55 text-white/90 px-3 py-1.5 rounded-full text-xs font-medium border border-white/15">
          💡 點擊下方按鈕或直接點擊畫面與牛奶蛙互動
        </div>
      </div>

      <!-- THE CORE 2D SVG ANIMATION SCENE -->
      <svg id="sceneSvg" viewBox="0 0 1000 560" class="w-full h-full block cursor-pointer" preserveAspectRatio="xMidYMid slice">
        <defs>
          <!-- Sky Gradients for Sunny, Rainy, and Night modes -->
          <linearGradient id="skySunny" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="65%" stop-color="#BAE6FD" />
            <stop offset="100%" stop-color="#FEF9C3" />
          </linearGradient>

          <linearGradient id="skyRainy" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="60%" stop-color="#64748B" />
            <stop offset="100%" stop-color="#94A3B8" />
          </linearGradient>

          <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#090D16" />
            <stop offset="55%" stop-color="#1E1B4B" />
            <stop offset="100%" stop-color="#311042" />
          </linearGradient>

          <!-- Bike Frame Carbon Metallic Gradient -->
          <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#EF4444" />
            <stop offset="50%" stop-color="#DC2626" />
            <stop offset="100%" stop-color="#991B1B" />
          </linearGradient>

          <!-- Aero Helmet Gradient -->
          <linearGradient id="helmetGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="55%" stop-color="#0284C7" />
            <stop offset="100%" stop-color="#0369A1" />
          </linearGradient>

          <!-- Headlight Cone Beam Gradient -->
          <linearGradient id="headlightBeamGrad" x1="0" y1="0.5" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.85" />
            <stop offset="40%" stop-color="#FEF08A" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
          </linearGradient>

          <!-- Taillight Glow -->
          <radialGradient id="taillightGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#FF2E4C" stop-opacity="0.95" />
            <stop offset="45%" stop-color="#EF4444" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
          </radialGradient>

          <!-- ===== PHOTO-ACCURATE YELLOW PEAR FROG GRADIENTS (3D柔滑黃色大肚奶蛙漸層) ===== -->
          <!-- Main 3D Matte Yellow Body Gradient -->
          <radialGradient id="frogBodyGrad" cx="0.38" cy="0.28" r="0.72">
            <stop offset="0%" stop-color="#FFEA70" />
            <stop offset="45%" stop-color="#FFD026" />
            <stop offset="82%" stop-color="#F0A808" />
            <stop offset="100%" stop-color="#D48800" />
          </radialGradient>

          <!-- Soft Cream-Yellow Big Belly Patch Gradient (淺奶黃色大肚皮) -->
          <radialGradient id="frogBellyGrad" cx="0.45" cy="0.4" r="0.65">
            <stop offset="0%" stop-color="#FAF0CA" />
            <stop offset="55%" stop-color="#F2DC91" />
            <stop offset="100%" stop-color="#DEC068" />
          </radialGradient>

          <!-- Mint-Green / Sage-Green Eye Rim Gradient (標誌性薄荷綠眼圈) -->
          <radialGradient id="frogEyeMint" cx="0.4" cy="0.35" r="0.65">
            <stop offset="0%" stop-color="#B5E0C2" />
            <stop offset="60%" stop-color="#89BF9A" />
            <stop offset="100%" stop-color="#5E9470" />
          </radialGradient>

          <!-- Vocal Sac Translucent Warm Yellow-Cream Gradient -->
          <radialGradient id="vocalSacGrad" cx="0.35" cy="0.35" r="0.65">
            <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.96" />
            <stop offset="55%" stop-color="#FDE68A" stop-opacity="0.92" />
            <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9" />
          </radialGradient>

          <!-- Right Calf Gradient: Yellow to Dark Olive-Brown Ankle (小腿至腳踝漸層深橄欖褐色) -->
          <linearGradient id="rightCalfGrad" id="rightCalfGrad" gradientUnits="userSpaceOnUse" x1="465" y1="320" x2="465" y2="430">
            <stop offset="0%" stop-color="#FFC824" />
            <stop offset="52%" stop-color="#DDA214" />
            <stop offset="82%" stop-color="#7A6620" />
            <stop offset="100%" stop-color="#4B3E13" />
          </linearGradient>

          <!-- Left (Far) Calf Gradient: Darker Yellow to Dark Olive-Brown Ankle -->
          <linearGradient id="leftCalfGrad" gradientUnits="userSpaceOnUse" x1="465" y1="320" x2="465" y2="430">
            <stop offset="0%" stop-color="#E5A910" />
            <stop offset="52%" stop-color="#C48B0E" />
            <stop offset="82%" stop-color="#66551A" />
            <stop offset="100%" stop-color="#3B310F" />
          </linearGradient>

          <!-- Right Forearm Gradient: Yellow to Dark Olive-Brown Wrist/Hand (手臂至手掌漸層深橄欖褐色) -->
          <linearGradient id="rightArmGrad" gradientUnits="userSpaceOnUse" x1="490" y1="245" x2="600" y2="255">
            <stop offset="0%" stop-color="#FFD026" />
            <stop offset="58%" stop-color="#E5A812" />
            <stop offset="83%" stop-color="#786521" />
            <stop offset="100%" stop-color="#4A3E14" />
          </linearGradient>

          <!-- Left Forearm Gradient -->
          <linearGradient id="leftArmGrad" gradientUnits="userSpaceOnUse" x1="490" y1="245" x2="590" y2="270">
            <stop offset="0%" stop-color="#E0A510" />
            <stop offset="60%" stop-color="#C28B0E" />
            <stop offset="85%" stop-color="#61521A" />
            <stop offset="100%" stop-color="#382F0F" />
          </linearGradient>

          <!-- 3-Toed Webbed Foot Gradient (深橄欖褐色三趾大腳掌) -->
          <linearGradient id="oliveFootGrad" x1="0" y1="0" x2="1" y2="0.4">
            <stop offset="0%" stop-color="#6E5C1E" />
            <stop offset="55%" stop-color="#4B3F14" />
            <stop offset="100%" stop-color="#28220A" />
          </linearGradient>

          <!-- Soft 3D Drop Shadow -->
          <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.28"/>
          </filter>
        </defs>

        <!-- ==================== 1. SKY & CELESTIAL LAYER ==================== -->
        <rect id="skyRect" x="0" y="0" width="1000" height="450" fill="url(#skySunny)" />

        <!-- Night Stars Group (Visible in Dusk/Night mode) -->
        <g id="starsGroup" opacity="0" style="transition: opacity 0.6s ease">
          <circle cx="120" cy="65" r="2" fill="#FFF" opacity="0.9"/>
          <circle cx="240" cy="40" r="1.5" fill="#FEF08A" opacity="0.8"/>
          <circle cx="390" cy="85" r="2.2" fill="#FFF" opacity="0.95"/>
          <circle cx="550" cy="50" r="1.6" fill="#BAE6FD" opacity="0.7"/>
          <circle cx="680" cy="95" r="2" fill="#FFF" opacity="0.85"/>
          <circle cx="820" cy="45" r="2.5" fill="#FEF08A" opacity="0.9"/>
          <circle cx="930" cy="80" r="1.5" fill="#FFF" opacity="0.8"/>
          <circle cx="70" cy="140" r="1.5" fill="#FFF" opacity="0.7"/>
          <circle cx="480" cy="120" r="1.8" fill="#FFF" opacity="0.8"/>
          <!-- Crescent Moon -->
          <path d="M845 65 A32 32 0 1 0 885 105 A26 26 0 1 1 845 65 Z" fill="#FEF08A" filter="url(#softShadow)"/>
        </g>

        <!-- Sun Group (Visible in Sunny mode) -->
        <g id="sunGroup" transform="translate(850, 90)" style="transition: all 0.6s ease">
          <circle cx="0" cy="0" r="56" fill="#FDE047" opacity="0.25" />
          <circle cx="0" cy="0" r="42" fill="#FACC15" opacity="0.4" />
          <circle cx="0" cy="0" r="30" fill="#FEF08A" />
        </g>

        <!-- ==================== 2. PARALLAX CLOUDS ==================== -->
        <g id="cloudsLayer" opacity="0.92"></g>

        <!-- ==================== 3. PARALLAX DISTANT MOUNTAINS ==================== -->
        <g id="farHillsLayer"></g>
        <g id="nearHillsLayer"></g>

        <!-- ==================== 4. PARALLAX ROADSIDE TREES &POSTS ==================== -->
        <g id="treesLayer"></g>

        <!-- ==================== 5. ROAD & GROUND LAYER ==================== -->
        <g id="roadLayer">
          <!-- Grass Shoulder -->
          <rect id="grassShoulder" x="0" y="425" width="1000" height="22" fill="#22C55E" />
          <!-- Red/White Cycling Curb -->
          <rect x="0" y="442" width="1000" height="8" fill="#E2E8F0" />
          <!-- Asphalt Road Surface -->
          <rect id="asphaltRect" x="0" y="450" width="1000" height="110" fill="#334155" />
          <!-- Top Edge Road Line -->
          <line x1="0" y1="458" x2="1000" y2="458" stroke="#F8FAFC" stroke-width="3" opacity="0.7" />
          <!-- Dynamic Dashed Center Lines & Pebbles -->
          <g id="roadDashesGroup"></g>
        </g>

        <!-- ==================== 6. SPEED LINES (SPRINT OVERLAY) ==================== -->
        <g id="speedLinesGroup" opacity="0"></g>

        <!-- ==================== 7. BICYCLE & MILK FROG ASSEMBLY ==================== -->
        <!-- Bike Shadow on Asphalt -->
        <ellipse id="bikeGroundShadow" cx="485" cy="488" rx="185" ry="14" fill="#0F172A" opacity="0.4" />

        <!-- Whole Bike + Frog Group (Pivots around Rear Wheel (330, 410) for Wheelies!) -->
        <g id="bikeMasterGroup" transform="translate(0, 0)">
          
          <!-- ===== 7A. FAR (LEFT) LEG & PEDAL (Behind Bike Frame) ===== -->
          <g id="leftLegGroup">
            <!-- Left Crank Arm (Behind) -->
            <line id="leftCrankLine" x1="465" y1="410" x2="465" y2="452" stroke="#475569" stroke-width="8" stroke-linecap="round" />
            <!-- Left Thigh (Warm Shaded Yellow) -->
            <g id="leftThighGroup">
              <line id="leftThighBase" x1="0" y1="0" x2="0" y2="0" stroke="#9A6804" stroke-width="38" stroke-linecap="round" />
              <line id="leftThighMilk" x1="0" y1="0" x2="0" y2="0" stroke="#E5A910" stroke-width="34" stroke-linecap="round" />
            </g>
            <!-- Left Calf (Yellow transitioning to Dark Olive-Brown Ankle) -->
            <g id="leftCalfGroup">
              <line id="leftCalfBase" x1="0" y1="0" x2="0" y2="0" stroke="#3B310F" stroke-width="28" stroke-linecap="round" />
              <line id="leftCalfMilk" x1="0" y1="0" x2="0" y2="0" stroke="url(#leftCalfGrad)" stroke-width="24" stroke-linecap="round" />
            </g>
            <!-- Left Frog Foot with 3 Dark Olive-Brown Webbed Toes -->
            <g id="leftFootGroup"></g>
            <!-- Left Pedal Platform -->
            <rect id="leftPedalRect" x="-14" y="-5" width="28" height="10" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="2" />
          </g>

          <!-- ===== 7B. FAR (LEFT) ARM (Behind Handlebar) ===== -->
          <g id="leftArmGroup">
            <path id="leftArmPathBase" d="M480 250 Q525 280 578 275" fill="none" stroke="#59460E" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" />
            <path id="leftArmPathMilk" d="M480 250 Q525 280 578 275" fill="none" stroke="url(#leftArmGrad)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" />
          </g>

          <!-- ===== 7C. REAR & FRONT WHEELS ===== -->
          <!-- Rear Wheel centered at (330, 410), radius 75 -->
          <g id="rearWheelWrapper" transform="translate(330, 410)">
            <g id="rearWheelSpin">
              <!-- Spokes -->
              <g stroke="#CBD5E1" stroke-width="1.8" opacity="0.85">
                <line x1="-70" y1="0" x2="70" y2="0" />
                <line x1="0" y1="-70" x2="0" y2="70" />
                <line x1="-50" y1="-50" x2="50" y2="50" />
                <line x1="-50" y1="50" x2="50" y2="-50" />
                <line x1="-65" y1="-27" x2="65" y2="27" />
                <line x1="-27" y1="-65" x2="27" y2="65" />
                <line x1="27" y1="-65" x2="-27" y2="65" />
                <line x1="65" y1="-27" x2="-65" y2="27" />
              </g>
              <!-- Deep Carbon Aero Rim -->
              <circle cx="0" cy="0" r="66" fill="none" stroke="#1E293B" stroke-width="10" />
              <!-- Rim Stickers & Valve -->
              <path d="M -52 -38 A 65 65 0 0 1 -20 -62" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
              <path d="M 52 38 A 65 65 0 0 1 20 62" fill="none" stroke="#F43F5E" stroke-width="4" stroke-linecap="round" />
              <!-- Presta Valve -->
              <line x1="0" y1="54" x2="0" y2="63" stroke="#FACC15" stroke-width="3" />
              <!-- Rear Cassette Gears -->
              <circle cx="0" cy="0" r="18" fill="#475569" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 2" />

      // ==========================================
      // 1. WEB AUDIO SYNTHESIZER (No external MP3 needed)
      // ==========================================
      class FrogSoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }

        // Cute resonant Milk Frog "Ribbit / Gua! Gua!" + crisp bicycle bell
        playCroakAndBell() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;

          // 1) Crisp Bicycle Bell "Ding-Ding!"
          [0, 0.14].forEach((offset) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2480, now + offset);
            gain.gain.setValueAtTime(0.18, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.55);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.56);
          });

          // 2) Dual Resonant Frog Croaks ("Gua! Gua!")
          [0.06, 0.34].forEach((offset, idx) => {
            const osc = this.ctx.createOscillator();
            const mod = this.ctx.createOscillator();
            const modGain = this.ctx.createGain();
            const mainGain = this.ctx.createGain();

            // throat rattle modulation
            mod.type = 'sawtooth';
            mod.frequency.setValueAtTime(38, now + offset);
            modGain.gain.setValueAtTime(45, now + offset);

            osc.type = 'triangle';
            const startFreq = idx === 0 ? 170 : 195;
            const peakFreq = idx === 0 ? 340 : 390;
            osc.frequency.setValueAtTime(startFreq, now + offset);
            osc.frequency.exponentialRampToValueAtTime(peakFreq, now + offset + 0.14);
            osc.frequency.exponentialRampToValueAtTime(140, now + offset + 0.24);

            mainGain.gain.setValueAtTime(0.01, now + offset);
            mainGain.gain.linearRampToValueAtTime(0.28, now + offset + 0.05);
            mainGain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.25);

            mod.connect(modGain);
            modGain.connect(osc.frequency);
            osc.connect(mainGain);
            mainGain.connect(this.ctx.destination);

            osc.start(now + offset);
            mod.start(now + offset);
            osc.stop(now + offset + 0.26);
            mod.stop(now + offset + 0.26);
          });
        }

        // Elastic Tongue Zap & Slurp Sound
        playTongueCatch() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.18);

          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.21);

          // Power-up chime after eating
          setTimeout(() => {
            if (this.muted || !this.ctx) return;
            const t = this.ctx.currentTime;
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = 'triangle';
              o.frequency.setValueAtTime(freq, t + i * 0.055);
              g.gain.setValueAtTime(0.14, t + i * 0.055);
              g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.055 + 0.18);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(t + i * 0.055);
              o.stop(t + i * 0.055 + 0.19);
            });
          }, 140);
        }

        // Whoosh sound for Sprint or Wheelie
        playBoost(isHigh = true) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(isHigh ? 220 : 440, now);
          osc.frequency.exponentialRampToValueAtTime(isHigh ? 660 : 180, now + 0.25);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.27);
        }
      }

      // ==========================================
      // 5. 2-BONE INVERSE KINEMATICS (IK) FOR FROG LEGS
      // ==========================================
      // Solves knee position (kx, ky) given Hip (hx, hy) and Ankle/Foot (ax, ay)
      // Knee bends forward-right (towards handlebar) as on a bicycle.
      function solveLegIK(hx, hy, ax, ay, L1, L2) {
        const dx = ax - hx;
        const dy = ay - hy;
        let dist = Math.hypot(dx, dy);

        // Clamp reach so legs never detach
        const maxReach = L1 + L2 - 0.5;
        const minReach = Math.abs(L1 - L2) + 0.5;
        if (dist > maxReach) dist = maxReach;
        if (dist < minReach) dist = minReach;

        // Law of cosines for angle at hip
        const cosAngle = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
        const clampedCos = Math.max(-1, Math.min(1, cosAngle));
        const baseAngle = Math.atan2(dy, dx);
        const kneeOffsetAngle = Math.acos(clampedCos);

        // Subtract offset angle so knee bends upward/rightward (anatomically correct for right-facing cyclist)
        const hipAngle = baseAngle - kneeOffsetAngle;

        const kx = hx + L1 * Math.cos(hipAngle);
        const ky = hy + L1 * Math.sin(hipAngle);
        return { kx, ky };
      }

      function spawnFloatingPopup(x, y, text, colorHex = '#FEF08A') {
        const g = document.createElementNS(svgNS, 'g');
        g.setAttribute('transform', `translate(${x}, ${y})`);
        g.innerHTML = `

        `;
        el.popupsLayer.appendChild(g);

        let start = null;
        function animatePopup(ts) {
          if (!start) start = ts;
          const p = Math.min(1, (ts - start) / 1100);
          const curY = y - p * 55;
          const scale = p < 0.2 ? 0.5 + (p / 0.2) * 0.6 : 1.1 - (p - 0.2) * 0.15;
          g.setAttribute('transform', `translate(${x}, ${curY}) scale(${scale})`);
          g.setAttribute('opacity', String(1 - Math.pow(p, 2)));
          if (p < 1) {
            requestAnimationFrame(animatePopup);
          } else {
            g.remove();
          }
        }
        requestAnimationFrame(animatePopup);
      }

        for (let i = 0; i < 2; i++) {
          setTimeout(() => {
            const ring = document.createElementNS(svgNS, 'circle');
            ring.setAttribute('cx', String(headCenter.x + 20));
            ring.setAttribute('cy', String(headCenter.y));
            ring.setAttribute('r', '15');
            ring.setAttribute('fill', 'none');
            ring.setAttribute('stroke', '#38BDF8');
            ring.setAttribute('stroke-width', '4');
            el.soundwavesLayer.appendChild(ring);

            let start = null;
            function animWave(ts) {
              if (!start) start = ts;
              const p = Math.min(1, (ts - start) / 650);
              ring.setAttribute('r', String(15 + p * 95));
              ring.setAttribute('opacity', String(1 - p));
              ring.setAttribute('stroke-width', String(4 * (1 - p)));
              if (p < 1) requestAnimationFrame(animWave);
              else ring.remove();
            }
            requestAnimationFrame(animWave);
          }, i * 220);
        }
      }

      // --- Feature 4: Wheelie Stunt (翹頭特技) ---
      function triggerWheelieStunt() {
        state.isWheelie = true;
        state.wheelieTimer = 2.6; // Hold wheelie for 2.6 seconds
        sound.playBoost(true);
        spawnFloatingPopup(500, 120, '🌟 獨輪翹頭特技！STYLE +100', '#F43F5E');
      }

      // --- Feature 5: Cycle Weather (Sunny -> Happy Rain -> Starry Night) ---
      let rainParticles = [];
      function initRainParticles() {
        rainParticles = [];
        for (let i = 0; i < 42; i++) {
          rainParticles.push({
            x: Math.random() * 1100,
            y: Math.random() * 520,
            len: 16 + Math.random() * 14,
            speed: 14 + Math.random() * 6
          });
        }
      }
      initRainParticles();

      function cycleWeatherMode() {
        state.weatherIndex = (state.weatherIndex + 1) % 3;
        sound.playBoost(state.weatherIndex === 1);

        if (state.weatherIndex === 0) {
          // SUNNY MODE
          el.skyRect.setAttribute('fill', 'url(#skySunny)');
          el.sunGroup.setAttribute('opacity', '1');
          el.sunGroup.setAttribute('transform', 'translate(850, 90)');
          el.starsGroup.setAttribute('opacity', '0');
          el.bikeLightsGroup.setAttribute('opacity', '0');
          el.grassShoulder.setAttribute('fill', '#22C55E');
          el.asphaltRect.setAttribute('fill', '#334155');
          el.frogTorso.classList.remove('wet-frog-glow');
          el.wetTorsoHighlight.setAttribute('opacity', '0.25');

          el.weatherIcon.textContent = '☀️';
          el.weatherText.textContent = '晴空微風 · 適合騎行';
          el.humidityPill.classList.add('hidden');
          el.humidityPill.classList.remove('flex');
          el.weatherBtnEmoji.textContent = '🌧️';
          el.weatherBtnSub.textContent = '目前：晴天 (點我淋雨)';
          el.weatherFxLayer.innerHTML = '';
          spawnFloatingPopup(500, 150, '☀️ 陽光普照好天氣！', '#FACC15');

        } else if (state.weatherIndex === 1) {
          // HAPPY RAIN MODE (Milk Frog loves humidity!)
          el.skyRect.setAttribute('fill', 'url(#skyRainy)');
          el.sunGroup.setAttribute('opacity', '0');
          el.starsGroup.setAttribute('opacity', '0');
          el.bikeLightsGroup.setAttribute('opacity', '0.75');
          el.grassShoulder.setAttribute('fill', '#15803D');
          el.asphaltRect.setAttribute('fill', '#1E293B');
          el.frogTorso.classList.add('wet-frog-glow');
          el.wetTorsoHighlight.setAttribute('opacity', '0.85');

          el.weatherIcon.textContent = '🌧️';
          el.weatherText.textContent = '雨林陣雨 · 牛奶蛙最愛淋雨！';
          el.humidityPill.classList.remove('hidden');
          el.humidityPill.classList.add('flex');
          el.weatherBtnEmoji.textContent = '🌙';
          el.weatherBtnSub.textContent = '目前：快樂淋雨 (點我切夜景)';
          spawnFloatingPopup(500, 150, '💧 濕度 100%！牛奶蛙超開心！', '#38BDF8');

        } else {
          // STARRY NIGHT MODE (Headlight & Taillight On)
          el.skyRect.setAttribute('fill', 'url(#skyNight)');
          el.sunGroup.setAttribute('opacity', '0');
          el.starsGroup.setAttribute('opacity', '1');
          el.bikeLightsGroup.setAttribute('opacity', '1');
          el.grassShoulder.setAttribute('fill', '#064E3B');
          el.asphaltRect.setAttribute('fill', '#0F172A');
          el.frogTorso.classList.remove('wet-frog-glow');
          el.wetTorsoHighlight.setAttribute('opacity', '0.35');

          el.weatherIcon.textContent = '🌙';
          el.weatherText.textContent = '星夜破風 · 前後車燈已開啟';
          el.humidityPill.classList.add('hidden');
          el.humidityPill.classList.remove('flex');
          el.weatherBtnEmoji.textContent = '☀️';
          el.weatherBtnSub.textContent = '目前：星夜騎行 (點我切晴天)';
          el.weatherFxLayer.innerHTML = '';
          spawnFloatingPopup(500, 150, '🔦 夜騎模式！開啟破風頭尾燈！', '#C084FC');
        }
      }

      // ==========================================
      // 7. MAIN PHYSICS & KINEMATICS ANIMATION LOOP
      // ==========================================
      let lastTime = performance.now();

      function animate(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        // 1) Calculate Target Speed, Cadence & Power
        if (state.boostTimer > 0) state.boostTimer = Math.max(0, state.boostTimer - dt);
        const bugBonusSpeed = state.boostTimer > 0 ? 9.5 : 0;

        const baseTarget = state.isSprinting ? 53.8 : 31.5;
        const rainBonus = state.weatherIndex === 1 ? 2.5 : 0; // Frogs ride happier in rain!
        state.targetSpeed = baseTarget + bugBonusSpeed + rainBonus + Math.sin(now * 0.0025) * 0.6;

        state.currentSpeed += (state.targetSpeed - state.currentSpeed) * dt * 4.5;
        state.currentCadence = Math.round(state.currentSpeed * 2.68);
        state.currentPower = Math.round(Math.pow(state.currentSpeed / 10, 2.55) * 14);
        state.calories += (state.currentPower * dt) / 4184 * 12;

        // Update Cycling Computer HUD
        el.hudSpeed.textContent = state.currentSpeed.toFixed(1);
        el.hudCadence.textContent = String(state.currentCadence);
        el.hudPower.textContent = String(state.currentPower);
        el.hudKcal.textContent = String(Math.floor(state.calories));

        // 2) Update Crank, Chain & Wheel Rotations
        const crankAngularVel = (state.currentCadence / 60) * Math.PI * 2; // rad/s
        state.crankAngle = (state.crankAngle + crankAngularVel * dt) % (Math.PI * 2);
        state.wheelAngle = (state.wheelAngle + state.currentSpeed * 12.5 * dt) % 360;
        state.chainOffset = (state.chainOffset - state.currentSpeed * 1.6 * dt) % 12;

        el.rearWheelSpin.setAttribute('transform', `rotate(${state.wheelAngle})`);
        el.frontWheelSpin.setAttribute('transform', `rotate(${state.wheelAngle})`);
        el.chainringSpin.setAttribute('transform', `translate(465, 410) rotate(${(state.crankAngle * 180) / Math.PI})`);
        el.bikeChainAnimated.setAttribute('stroke-dashoffset', String(state.chainOffset));

        // 3) Update Parallax Scrolling Background
        const pxSpeed = state.currentSpeed * 11.5; // pixels/sec on road
        state.scrollClouds = (state.scrollClouds + pxSpeed * 0.06 * dt) % 1200;
        state.scrollFarHills = (state.scrollFarHills + pxSpeed * 0.14 * dt) % 1000;
        state.scrollNearHills = (state.scrollNearHills + pxSpeed * 0.30 * dt) % 1000;
        state.scrollTrees = (state.scrollTrees + pxSpeed * 0.62 * dt) % 1200;
        state.scrollRoad = (state.scrollRoad + pxSpeed * 1.0 * dt) % 125;

        el.cloudsLayer.setAttribute('transform', `translate(${-state.scrollClouds}, 0)`);
        el.farHillsLayer.setAttribute('transform', `translate(${-state.scrollFarHills}, 0)`);
        el.nearHillsLayer.setAttribute('transform', `translate(${-state.scrollNearHills}, 0)`);
        el.treesLayer.setAttribute('transform', `translate(${-state.scrollTrees}, 0)`);
        el.roadDashesGroup.setAttribute('transform', `translate(${-state.scrollRoad}, 0)`);

        // 4) Sprint Speed Lines & Sweat Effects
        const targetAero = state.isSprinting ? 1 : 0;
        state.aeroLeanLerp += (targetAero - state.aeroLeanLerp) * dt * 6;

        if (state.aeroLeanLerp > 0.05) {
          el.speedLinesGroup.setAttribute('opacity', String(state.aeroLeanLerp * 0.85));
          el.sweatDropsGroup.setAttribute('opacity', String(state.aeroLeanLerp));
          const lines = el.speedLinesGroup.querySelectorAll('.speed-line');
          lines.forEach((line, idx) => {
            const curX = ( (now * 1.8 + idx * 190) % 1250 );
            const x1 = 1000 - curX;
            const w = 130 + (idx % 3) * 80;
            line.setAttribute('x1', String(x1));
            line.setAttribute('x2', String(x1 + w));
          });
        } else {
          el.speedLinesGroup.setAttribute('opacity', '0');
          el.sweatDropsGroup.setAttribute('opacity', '0');
        }

        // 5) Wheelie Stunt Pitch Rotation around Rear Hub (330, 410)
        if (state.isWheelie) {
          state.wheelieTimer -= dt;
          if (state.wheelieTimer <= 0) state.isWheelie = false;
        }
        const targetWheelieDeg = state.isWheelie ? -24 + Math.sin(now * 0.012) * 2.2 : 0;
        state.wheelieAngle += (targetWheelieDeg - state.wheelieAngle) * dt * 7;

        el.bikeMasterGroup.setAttribute('transform', `rotate(${state.wheelieAngle}, 330, 410)`);
        // Shrink & shift ground shadow during wheelie
        const shadowScale = 1 - Math.abs(state.wheelieAngle) / 55;
        el.bikeGroundShadow.setAttribute('rx', String(185 * shadowScale));
        el.bikeGroundShadow.setAttribute('cx', String(485 - Math.abs(state.wheelieAngle) * 3.2));

        // 6) Calculate Crank Pedals & Solve 2-Bone IK for Both Milk Frog Legs
        const bbX = 465;
        const bbY = 410;
        const crankRadius = 42;

        // Right Pedal (Near)
        const rPedalX = bbX + crankRadius * Math.cos(state.crankAngle);
        const rPedalY = bbY + crankRadius * Math.sin(state.crankAngle);

        // Left Pedal (Far - opposite phase)
        const lAngle = state.crankAngle + Math.PI;
        const lPedalX = bbX + crankRadius * Math.cos(lAngle);
        const lPedalY = bbY + crankRadius * Math.sin(lAngle);

        // Update Crank Lines & Pedal Platforms
        el.rightCrankLine.setAttribute('x2', String(rPedalX));
        el.rightCrankLine.setAttribute('y2', String(rPedalY));
        el.rightCrankAccent.setAttribute('x2', String(rPedalX));
        el.rightCrankAccent.setAttribute('y2', String(rPedalY));
        el.rightPedalRect.setAttribute('transform', `translate(${rPedalX}, ${rPedalY})`);

        el.leftCrankLine.setAttribute('x2', String(lPedalX));
        el.leftCrankLine.setAttribute('y2', String(lPedalY));
        el.leftPedalRect.setAttribute('transform', `translate(${lPedalX}, ${lPedalY})`);

        // Natural Upper Body Bobbing synced with double-cadence pedal strokes
        const bobY = Math.sin(state.crankAngle * 2) * (2.8 + state.aeroLeanLerp * 2.5);
        const hipX = 408 + state.aeroLeanLerp * 18;
        const hipY = 242 + bobY + state.aeroLeanLerp * 6;

        // Solve IK for Right Leg (Thigh = 92, Calf = 90)
        const rFootAnkleX = rPedalX - 4;
        const rFootAnkleY = rPedalY - 6;
        const rightIK = solveLegIK(hipX, hipY, rFootAnkleX, rFootAnkleY, 92, 90);

        // Update dynamic gradient coordinates so the yellow-to-olive-brown ankle transition stays locked to the calf bone
        el.rightCalfGrad.setAttribute('x1', String(rightIK.kx));
        el.rightCalfGrad.setAttribute('y1', String(rightIK.ky));
        el.rightCalfGrad.setAttribute('x2', String(rFootAnkleX));
        el.rightCalfGrad.setAttribute('y2', String(rFootAnkleY));

        [el.rightThighOutline, el.rightThighBase, el.rightThighMilk].forEach((line) => {
          line.setAttribute('x1', String(hipX));
          line.setAttribute('y1', String(hipY));
          line.setAttribute('x2', String(rightIK.kx));
          line.setAttribute('y2', String(rightIK.ky));
        });
        [el.rightCalfOutline, el.rightCalfBase, el.rightCalfMilk].forEach((line) => {
          line.setAttribute('x1', String(rightIK.kx));
          line.setAttribute('y1', String(rightIK.ky));
          line.setAttribute('x2', String(rFootAnkleX));
          line.setAttribute('y2', String(rFootAnkleY));
        });
        el.rightKneeDot.setAttribute('cx', String(rightIK.kx));
        el.rightKneeDot.setAttribute('cy', String(rightIK.ky));
        el.rightFootGroup.setAttribute('transform', `translate(${rPedalX}, ${rPedalY})`);

        // Solve IK for Left Leg (Far)
        const lHipX = hipX + 6;
        const lHipY = hipY - 4;
        const lFootAnkleX = lPedalX - 4;
        const lFootAnkleY = lPedalY - 6;
        const leftIK = solveLegIK(lHipX, lHipY, lFootAnkleX, lFootAnkleY, 92, 90);

        el.leftCalfGrad.setAttribute('x1', String(leftIK.kx));
        el.leftCalfGrad.setAttribute('y1', String(leftIK.ky));
        el.leftCalfGrad.setAttribute('x2', String(lFootAnkleX));
        el.leftCalfGrad.setAttribute('y2', String(lFootAnkleY));

        [el.leftThighBase, el.leftThighMilk].forEach((line) => {
          line.setAttribute('x1', String(lHipX));
          line.setAttribute('y1', String(lHipY));
          line.setAttribute('x2', String(leftIK.kx));
          line.setAttribute('y2', String(leftIK.ky));
        });
        [el.leftCalfBase, el.leftCalfMilk].forEach((line) => {
          line.setAttribute('x1', String(leftIK.kx));
          line.setAttribute('y1', String(leftIK.ky));
          line.setAttribute('x2', String(lFootAnkleX));
          line.setAttribute('y2', String(lFootAnkleY));
        });
        el.leftFootGroup.setAttribute('transform', `translate(${lPedalX}, ${lPedalY})`);

        // 7) Frog Upper Body, Jiggling Potbelly, Head & Arm Articulation
        const bodyTiltDeg = state.aeroLeanLerp * 14 + Math.sin(state.crankAngle * 2) * 2.0;
        const upperX = 415 + state.aeroLeanLerp * 18;
        const upperY = 232 + bobY + state.aeroLeanLerp * 12;
        el.frogUpperBodyGroup.setAttribute('transform', `translate(${upperX}, ${upperY}) rotate(${bodyTiltDeg})`);

        // Cute Q-elastic Belly Bounce synced with pedaling and croaking
        const bellyBounce = Math.sin(state.crankAngle * 2 - 0.6) * 2.2 + (state.croakTimer > 0 ? Math.sin(state.croakTimer * Math.PI * 4) * 4 : 0);
        el.frogBigBellyPatch.setAttribute('transform', `translate(${bellyBounce * 0.6}, ${bellyBounce})`);

        // Head subtle counter-tilt so our yellow pear frog always looks ahead
        const headBobDeg = -bodyTiltDeg * 0.55 + Math.cos(state.crankAngle * 2) * 2.0;
        el.frogHeadGroup.setAttribute('transform', `translate(76, -54) rotate(${headBobDeg})`);

        // Connect Arms from Moving Shoulder to Handlebar Hoods / Drops
        const shoulderX = upperX + 62;
        const shoulderY = upperY - 10;
        // In sprint mode, hands drop lower on the drop bar
        const handX = 595 + state.aeroLeanLerp * 4;
        const handY = 252 + state.aeroLeanLerp * 22;
        const elbowX = (shoulderX + handX) * 0.5 - 12;
        const elbowY = (shoulderY + handY) * 0.5 + 24 + state.aeroLeanLerp * 12;

        // Update arm gradient vectors so the wrist always fades into dark olive-brown right at the handlebar
        el.rightArmGrad.setAttribute('x1', String(shoulderX));
        el.rightArmGrad.setAttribute('y1', String(shoulderY));
        el.rightArmGrad.setAttribute('x2', String(handX));
        el.rightArmGrad.setAttribute('y2', String(handY));

        el.leftArmGrad.setAttribute('x1', String(shoulderX - 6));
        el.leftArmGrad.setAttribute('y1', String(shoulderY - 4));
        el.leftArmGrad.setAttribute('x2', String(handX - 12));
        el.leftArmGrad.setAttribute('y2', String(handY + 6));

        const armD = `M ${shoulderX} ${shoulderY} Q ${elbowX} ${elbowY} ${handX} ${handY}`;
        el.rightArmOutline.setAttribute('d', armD);
        el.rightArmBase.setAttribute('d', armD);
        el.rightArmMilk.setAttribute('d', armD);
        el.rightHandPads.setAttribute('transform', `translate(${handX}, ${handY})`);

        const leftArmD = `M ${shoulderX - 6} ${shoulderY - 4} Q ${elbowX + 8} ${elbowY + 6} ${handX - 12} ${handY + 6}`;
        el.leftArmPathBase.setAttribute('d', leftArmD);
        el.leftArmPathMilk.setAttribute('d', leftArmD);

        // 8) Vocal Sac Inflation Animation (鼓腮鳴叫)
        if (state.croakTimer > 0) {
          state.croakTimer = Math.max(0, state.croakTimer - dt * 1.45);
          // Double pulse inflation matching the two "Gua! Gua!" sounds
          const pulse = Math.abs(Math.sin(state.croakTimer * Math.PI * 2));
          const sacRadius = 4 + pulse * 22;
          el.rightVocalSacGroup.setAttribute('opacity', '1');
          el.rightVocalSac.setAttribute('r', String(sacRadius));
          el.leftVocalSac.setAttribute('opacity', '0.95');
          el.leftVocalSac.setAttribute('r', String(sacRadius * 0.88));
        } else {
          el.rightVocalSacGroup.setAttribute('opacity', '0');
          el.leftVocalSac.setAttribute('opacity', '0');
        }

        // 9) Flying Bug & Elastic Tongue Catching Logic
        if (state.activeBug) {
          const bug = state.activeBug;
          const bugNode = document.getElementById('activeBugNode');

          if (!bug.caught) {
            bug.x -= dt * 290;
            bug.y = bug.baseY + Math.sin(now * 0.015 + bug.phase) * 18;

            // When bug enters tongue striking range (x <= 740), launch tongue!
            if (bug.x <= 740 && state.tongueState === 'idle') {
              state.tongueState = 'shooting';
              state.tongueProgress = 0;
              sound.playTongueCatch();
            }
          }

          // Calculate tongue target in frogHeadGroup local coordinates
          const headWorldX = upperX + 76;
          const headWorldY = upperY - 54;

          if (state.tongueState === 'shooting') {
            state.tongueProgress = Math.min(1, state.tongueProgress + dt * 11);
            if (state.tongueProgress >= 1) {
              bug.caught = true;
              state.tongueState = 'retracting';
            }
          } else if (state.tongueState === 'retracting') {
            state.tongueProgress = Math.max(0, state.tongueProgress - dt * 9.5);
            if (state.tongueProgress <= 0) {
              // Bug eaten!
              state.tongueState = 'idle';
              if (bugNode) bugNode.remove();
              state.activeBug = null;
              state.bugsEaten += 1;
              state.calories += 15;
              state.boostTimer = 2.8;
              el.hudBugs.textContent = String(state.bugsEaten);
              spawnFloatingPopup(headWorldX + 20, headWorldY - 35, bug.isGel ? '🍓 能量果膠補給！大肚皮功率 +50W' : '🦟 美味捕蟲成功！+HP 功率UP!', '#4ADE80');
            }
          }

          if (state.activeBug && bugNode) {
            if (state.tongueState !== 'idle') {
              el.tongueGroup.setAttribute('opacity', '1');
              el.frogMouthOpen.setAttribute('opacity', '1');
              el.frogMouthSmile.setAttribute('opacity', '0');

              const mouthX = 30;
              const mouthY = 8;
              const relBugX = bug.x - headWorldX;
              const relBugY = bug.y - headWorldY;

              const tipX = mouthX + (relBugX - mouthX) * state.tongueProgress;
              const tipY = mouthY + (relBugY - mouthY) * state.tongueProgress;

              el.tongueLine.setAttribute('x2', String(tipX));
              el.tongueLine.setAttribute('y2', String(tipY));
              el.tongueHighlight.setAttribute('x2', String(tipX));
              el.tongueHighlight.setAttribute('y2', String(tipY));
              el.tongueTip.setAttribute('cx', String(tipX));
              el.tongueTip.setAttribute('cy', String(tipY));

              if (bug.caught) {
                bug.x = headWorldX + tipX;
                bug.y = headWorldY + tipY;
              }
            } else {
              el.tongueGroup.setAttribute('opacity', '0');
              el.frogMouthOpen.setAttribute('opacity', '0');
              el.frogMouthSmile.setAttribute('opacity', '1');
            }

            bugNode.setAttribute('transform', `translate(${bug.x}, ${bug.y})`);
          }
        } else {
          el.tongueGroup.setAttribute('opacity', '0');
          el.frogMouthOpen.setAttribute('opacity', state.croakTimer > 0 ? '1' : '0');
          el.frogMouthSmile.setAttribute('opacity', state.croakTimer > 0 ? '0' : '1');
        }

        // 10) Frog Eye Expressions (Happy eyes in Rain/Croak/Boost, Determined brow in Sprint, Deadpan otherwise)
        state.blinkTimer += dt;
        if (state.blinkTimer > 3.8) {
          state.isBlinking = true;
          if (state.blinkTimer > 4.0) {
            state.isBlinking = false;
            state.blinkTimer = 0;
          }
        }

        const showHappyEyes = state.weatherIndex === 1 || state.croakTimer > 0 || state.boostTimer > 1.8 || state.isBlinking;
        el.mainEyeNormal.setAttribute('opacity', showHappyEyes ? '0' : '1');
        el.mainEyeHappy.setAttribute('opacity', showHappyEyes ? '1' : '0');
        el.sprintEyeBrows.setAttribute('opacity', (!showHappyEyes && state.isSprinting) ? '1' : '0');

        // 11) Weather Particles (Raindrops & Splashes in Rain Mode, Blinking Taillight in Night/Rain)
        if (state.weatherIndex === 1) {
          let rainSVG = '';
          rainParticles.forEach((p) => {
            p.x -= (8 + state.currentSpeed * 0.15);
            p.y += p.speed;
            if (p.y > 480) {
              // Road splash
              rainSVG += `<ellipse cx="${p.x}" cy="475" rx="6" ry="2" fill="none" stroke="#BAE6FD" stroke-width="1.5" opacity="0.7" />`;
              p.y = -20;
              p.x = Math.random() * 1150;
            }
            if (p.x < -30) p.x = 1100;
            rainSVG += `<line x1="${p.x}" y1="${p.y}" x2="${p.x - 7}" y2="${p.y + p.len}" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" opacity="0.65" />`;
          });
          el.weatherFxLayer.innerHTML = rainSVG;
        }

        if (state.weatherIndex >= 1) {
          const pulseScale = 0.8 + Math.abs(Math.sin(now * 0.008)) * 0.45;
          el.taillightHalo.setAttribute('r', String(26 * pulseScale));
        }

        requestAnimationFrame(animate);
      }

      // ==========================================
      // 8. EVENT LISTENERS & INITIALIZATION
      // ==========================================
      el.btnSprint.addEventListener('click', toggleSprintMode);
      el.btnBug.addEventListener('click', triggerBugSupply);
      el.btnCroak.addEventListener('click', triggerCroakHorn);
      el.btnWheelie.addEventListener('click', triggerWheelieStunt);
      el.btnWeather.addEventListener('click', cycleWeatherMode);

      // Clicking directly on the SVG canvas triggers interactive reactions based on click area
      el.sceneSvg.addEventListener('click', (e) => {
        const rect = el.sceneSvg.getBoundingClientRect();
        const clickX = ((e.clientX - rect.left) / rect.width) * 1000;
        const clickY = ((e.clientY - rect.top) / rect.height) * 560;

        if (clickX > 650 && clickY < 350) {
          triggerBugSupply();
        } else if (clickY < 260) {
          triggerCroakHorn();
        } else {
          triggerWheelieStunt();
        }
      });

      // Audio Mute Buttons
      function handleMuteToggle() {
        const isMuted = sound.toggleMute();
        const icon = isMuted ? '🔇' : '🔊';
        el.muteIconMobile.textContent = icon;
        el.muteIconDesktop.textContent = icon;
      }
      el.muteBtn.addEventListener('click', handleMuteToggle);
      el.muteBtnDesktop.addEventListener('click', handleMuteToggle);

      // Initialize Scenery & Start Loop
      initScenery();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
